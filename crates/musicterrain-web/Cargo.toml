[package]
name = "musicterrain-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Rust/WASM terrain kernel for the MusicTerrain web wallpaper"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
musicterrain = { path = "../musicterrain", default-features = false, features = ["scene"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
